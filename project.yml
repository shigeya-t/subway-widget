name: SubwayWidget
options:
  bundleIdPrefix: jp.shigeya
  deploymentTarget:
    macOS: "14.0"
configFiles:
  Debug: Config/Team.xcconfig
  Release: Config/Team.xcconfig

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.13.7

targets:
  SubwayWidget:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: SwiftSoup
        product: SwiftSoup
      - target: SubwayWidgetExtension
        embed: true
        codeSign: true
    scheme:
      testTargets:
        - SubwayWidgetTests
    info:
      path: App/Info.plist
      properties:
        # ウィジェットギャラリーのアプリ一覧は .app のファイル名を見る。
        # この名前は濁点を含まないので NFC/NFD の食い違いが起きない。
        CFBundleName: 東京地下鉄運行情報
        CFBundleDisplayName: 東京地下鉄運行情報
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        CFBundleIconName: AppIcon
        CFBundleIconFile: AppIcon
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
            CFBundleIconFiles:
              - AppIcon60x60
        "CFBundleIcons~ipad":
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
            CFBundleIconFiles:
              - AppIcon60x60
              - AppIcon76x76
        AppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: App/SubwayWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.shigeya.SubwayWidget
        PRODUCT_NAME: SubwayWidget
        WRAPPER_NAME: 東京地下鉄運行情報.app
        # 実行ファイル名は ASCII のまま。一覧用の .app 名だけ日本語にする。
        # 濁点付き（「バ」など）は LaunchServices と PluginKit の正規化がずれて拡張が起動しない。
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "10"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        APP_GROUP_ID: $(DEVELOPMENT_TEAM).jp.shigeya.SubwayWidget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: NO

  SubwayWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: WidgetExtension
      - path: Shared
    dependencies:
      - package: SwiftSoup
        product: SwiftSoup
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleName: 東京地下鉄運行情報
        CFBundleDisplayName: 東京地下鉄運行情報
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
            CFBundleIconFiles:
              - AppIcon60x60
        "CFBundleIcons~ipad":
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
            CFBundleIconFiles:
              - AppIcon60x60
              - AppIcon76x76
        AppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: WidgetExtension/SubwayWidgetExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.shigeya.SubwayWidget.Widget
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "10"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        APP_GROUP_ID: $(DEVELOPMENT_TEAM).jp.shigeya.SubwayWidget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: NO
        SKIP_INSTALL: false

  # ホストアプリを立てない単体テスト。SubwayWidget をテストホストにすると
  # 常駐アプリが起動して初回取得が走ってしまうため、Shared を直接取り込む。
  SubwayWidgetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Shared
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - package: SwiftSoup
        product: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.shigeya.SubwayWidget.Tests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
